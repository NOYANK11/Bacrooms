<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BACKROOMS</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: #222;
    padding: 25px;
    border-bottom: 2px solid #555;
}

h1 {
    font-size: 55px;
    margin: 10px;
    color: #e6c84a;
    letter-spacing: 5px;
}

.download-box {
    width: 420px;
    margin: 100px auto;
    padding: 35px;
    background: #1d1d1d;
    border: 1px solid #555;
    border-radius: 12px;
    box-shadow: 0 0 30px #000;
}

.download-box h2 {
    font-size: 30px;
}

.download-box p {
    color: #aaa;
}

.download-button {
    display: block;
    margin: 25px auto 15px;
    padding: 18px;
    background: #e6c84a;
    color: #111;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px;
}

.download-button:hover {
    transform: scale(1.04);
}

small {
    color: #777;
}
</style>
</head>

<body>

<div class="header">
    <h1>BACKROOMS</h1>
</div>

<div class="download-box">

    <h2>BACKROOMS</h2>

    <p>Windows için oyunu indir</p>

    <a class="download-button"
       href="BACKROOMS.exe"
       download>
       ⬇️ OYUNU İNDİR
    </a>

    <small>Windows • .EXE</small>

</div>

</body>
</html>
